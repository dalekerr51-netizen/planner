<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Dale's classes, calendar, to-dos, goals, and training in one place.">
<title>What's due</title>
<meta name="theme-color" content="#111214">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="What's due">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">

<style>
/* Direction: matches Dale's resume site.
   Fonts:  Apple's system font (San Francisco), no download
   Colors: #111214 ground, #17181B panels, #EDEDE8 ink, #8E918F muted, #2A2C2E rule;
           class colors are the only color; #F2994A flags what's urgent
   Sizes:  titles 1.75rem at 600, headings 1.125rem, body 1rem, labels 0.8125rem
   Layout: top bar with the DK monogram, tabs at the bottom on a phone and on top on a laptop
   Signature: the DK monogram draws itself on open; an orange now-line runs across the calendar */
:root {
  color-scheme: dark;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
  --ground: #111214; --surface: #17181B; --raised: #1E1F23;
  --ink: #EDEDE8; --muted: #8E918F; --rule: #2A2C2E;
  --flag: #F2994A; --flag-bg: #2B2016;
  --c1: #7FB2E5; --c2: #E59A82; --c3: #9CCB8F; --c4: #C3A5E8; --c5: #E6C170; --c6: #86C9C7;
  --scrim: rgba(0, 0, 0, 0.6);
  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --top: 3.5rem; --tabs: 4rem; --hour: 52px;
  --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 400 1rem/1.5 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body:has(dialog[open]) { overflow: hidden; }
button, input, select, textarea { font: inherit; font-size: 1rem; color: inherit; }
button { min-height: 44px; cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--display); margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
.wrap { width: min(100% - 2rem, 44rem); margin-inline: auto; }
.muted { color: var(--muted); }
.hint { color: var(--muted); font-size: 0.8125rem; }
.empty { color: var(--muted); }

/* Buttons */
.quiet { background: none; border: 0; padding: 0 0.5rem; color: var(--muted); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 4px; }
.quiet:hover { color: var(--ink); text-decoration-color: var(--ink); }
.primary { background: var(--ink); color: var(--ground); border: 0; border-radius: 8px; padding: 0.5rem 1.25rem; font-weight: 600; }
.primary:hover { opacity: 0.9; }
.outline { background: none; border: 1px solid var(--rule); border-radius: 8px; padding: 0.375rem 0.875rem; color: var(--ink); font-weight: 500; }
.outline:hover { border-color: var(--muted); }
.sq { width: 44px; padding: 0; font-variant-numeric: tabular-nums; }
.flush { margin-left: -0.5rem; }

/* Top bar */
.top { position: sticky; top: 0; z-index: 30; background: var(--ground); border-bottom: 1px solid var(--rule); padding-top: var(--safe-t); }
.top-in { width: min(100% - 2rem, 80rem); margin-inline: auto; height: var(--top); display: flex; align-items: center; gap: 0.875rem; }
.logo { display: block; padding: 0; background: none; border: 0; color: var(--ink); }
.logo svg { display: block; height: 1.375rem; width: auto; overflow: visible; }
.logo path { fill: var(--ink); stroke: var(--ink); stroke-width: 0; stroke-linejoin: round; }
.top h1 { font-size: 1.125rem; font-weight: 600; }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 0.25rem; }
.tabs-top, .add-top { display: none; }

/* Tabs at the bottom, and the add button */
.tabs { position: fixed; inset: auto 0 0 0; z-index: 30; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--ground); border-top: 1px solid var(--rule); padding-bottom: var(--safe-b); }
.tabs button { position: relative; height: var(--tabs); background: none; border: 0; color: var(--muted); font-size: 0.8125rem; font-weight: 500; }
.tabs button[aria-current="page"] { color: var(--ink); font-weight: 600; }
.tabs button[aria-current="page"]::before { content: ""; position: absolute; top: -1px; left: 28%; right: 28%; height: 2px; background: var(--ink); }
.fab { position: fixed; right: 1rem; bottom: calc(var(--tabs) + var(--safe-b) + 1rem); z-index: 31; width: 3.5rem; height: 3.5rem; border: 0; border-radius: 8px; background: var(--ink); color: var(--ground); font-size: 1.75rem; font-weight: 300; line-height: 1; }
main { padding-bottom: calc(var(--tabs) + var(--safe-b) + 6rem); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabs) + var(--safe-b) + 5.5rem); z-index: 40; max-width: calc(100% - 2rem); padding: 0.5rem 0.875rem; background: var(--raised); border: 1px solid var(--rule); border-radius: 8px; font-size: 0.875rem; }

/* Views and sections */
.view { padding-top: 1.5rem; }
.hello { padding-bottom: 1.25rem; }
.hello h2 { font-size: 1.75rem; font-weight: 600; line-height: 1.15; letter-spacing: -0.02em; }
.hello p { margin-top: 0.25rem; color: var(--muted); }
.sec { padding-block: 1.25rem; border-top: 1px solid var(--rule); }
#class-list > .sec:first-child, #goals-list > .sec:first-child { border-top: 0; padding-top: 0; }
.sec-head { display: flex; align-items: center; gap: 0.75rem; min-height: 2rem; margin-bottom: 0.5rem; }
.sec-head h2 { font-size: 1.125rem; font-weight: 600; }
.aside { margin-left: auto; color: var(--muted); font-size: 0.8125rem; white-space: nowrap; }
.sub-h { margin: 1rem 0 0.25rem; color: var(--muted); font-size: 0.8125rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
.step-line { font-size: 1.0625rem; font-weight: 600; }
.tip { margin-top: 0.75rem; color: var(--muted); font-size: 0.8125rem; }

/* Rows */
.rows { list-style: none; margin: 0; padding: 0; }
.row { display: grid; grid-template-columns: 3px minmax(0, 1fr) auto; column-gap: 0.75rem; align-items: center; padding: 0.25rem 0; border-bottom: 1px solid var(--rule); }
.row:last-child { border-bottom: 0; }
.row .bar { align-self: stretch; margin-block: 0.375rem; border-radius: 2px; background: var(--c, var(--ink)); }
.row .main { display: block; width: 100%; min-width: 0; min-height: 44px; padding: 0.375rem 0; background: none; border: 0; text-align: left; }
.row .t { display: block; font-weight: 600; overflow-wrap: anywhere; }
.row .m { display: block; margin-top: 0.0625rem; color: var(--muted); font-size: 0.8125rem; overflow-wrap: anywhere; }
.row .left { display: block; color: var(--flag); font-size: 0.8125rem; font-weight: 600; }
.row .r { color: var(--muted); font-size: 0.8125rem; text-align: right; white-space: nowrap; }
.row.done .t { color: var(--muted); font-weight: 400; text-decoration: line-through; }
.row.done .bar { opacity: 0.35; }
.row.past .t { color: var(--muted); }
.trow { grid-template-columns: 2rem minmax(0, 1fr) auto; }
.arow { grid-template-columns: 4.25rem 3px minmax(0, 1fr); }
.arow .time { color: var(--muted); font-size: 0.8125rem; font-variant-numeric: tabular-nums; }
.check { display: grid; place-items: center; width: 44px; height: 44px; margin-left: -0.625rem; padding: 0; background: none; border: 0; }
.check::before, .check::after { content: ""; grid-area: 1 / 1; }
.check::before { width: 1.25rem; height: 1.25rem; border: 1.5px solid var(--muted); border-radius: 6px; }
.check[aria-checked="true"]::before { background: var(--ink); border-color: var(--ink); }
.check[aria-checked="true"]::after { width: 0.375rem; height: 0.6875rem; margin-top: -0.1875rem; border: solid var(--ground); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.nowrow { display: grid; grid-template-columns: 4.25rem 1fr; column-gap: 0.75rem; align-items: center; padding: 0.25rem 0; color: var(--flag); font-size: 0.8125rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.nowrow::after { content: ""; height: 2px; border-radius: 1px; background: var(--flag); }
.soon-box { padding: 0.125rem 1rem; background: var(--flag-bg); border-left: 3px solid var(--flag); border-radius: 0 8px 8px 0; }
.soon-box .row { border-bottom-color: color-mix(in srgb, var(--flag) 18%, transparent); }
details.more > summary { display: flex; align-items: center; min-height: 44px; list-style: none; cursor: pointer; color: var(--muted); font-size: 0.875rem; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 4px; }
details.more > summary::-webkit-details-marker { display: none; }

/* Today: moving and hiding sections */
.card-ctl { display: flex; margin-left: auto; }
.editing .sec { padding-inline: 0.75rem; margin-inline: -0.75rem; border: 1px dashed var(--rule); border-radius: 8px; margin-bottom: 0.5rem; }
.editing .sec-head .aside { display: none; }

/* Goals */
.goal { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; column-gap: 0.75rem; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid var(--rule); }
.goal:last-child { border-bottom: 0; }
.goal .label { font-weight: 600; }
.goal .count { color: var(--muted); font-size: 0.875rem; font-variant-numeric: tabular-nums; }
.goal.met .label { color: var(--muted); text-decoration: line-through; }
.pips { display: flex; gap: 4px; margin-top: 0.375rem; }
.pips i { width: 0.75rem; height: 0.75rem; border: 1px solid var(--muted); border-radius: 2px; }
.pips i.on { background: var(--ink); border-color: var(--ink); }
.steps { display: flex; gap: 0.375rem; }
.goal.compact { grid-template-columns: minmax(0, 1fr) auto 44px; }

/* Classes */
.class-head { display: grid; grid-template-columns: 3px minmax(0, 1fr) auto; column-gap: 0.75rem; align-items: center; margin-bottom: 0.5rem; }
.class-head .bar { align-self: stretch; border-radius: 2px; background: var(--c); }
.class-head h2 { font-size: 1.125rem; font-weight: 600; }
.class-head p { color: var(--muted); font-size: 0.8125rem; }
.sched { margin-bottom: 0.5rem; color: var(--muted); font-size: 0.875rem; }

/* Plan */
.plan-out { margin-top: 1rem; padding: 1rem; background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; }
.plan-out .lead { font-weight: 600; }
.plan-out h3 { margin-top: 1rem; font-size: 1rem; font-weight: 600; }
.plan-out ul { margin: 0.25rem 0 0; padding-left: 1.125rem; }
.plan-out li { margin: 0.25rem 0; }
.plan-out .outro { margin-top: 1rem; color: var(--muted); }

/* Forms */
form.f { display: grid; gap: 0.875rem; margin-top: 1rem; }
.fl { display: grid; gap: 0.375rem; color: var(--muted); font-size: 0.8125rem; }
input, select, textarea { display: block; width: 100%; min-width: 0; min-height: 44px; padding: 0.5rem 0.75rem; border: 1px solid var(--rule); border-radius: 8px; background: var(--ground); color: var(--ink); }
input[type="date"], input[type="time"] { -webkit-appearance: none; appearance: none; }
input::-webkit-date-and-time-value { text-align: left; }
input::placeholder { color: var(--muted); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
.btns { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-top: 1rem; }
.qadd { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.5rem; margin-top: 0.75rem; }
.moves { display: flex; flex-wrap: wrap; gap: 0.375rem; }
.todo-form { margin: 0 0 0.5rem; }

/* Sheet */
dialog.sheet { position: fixed; inset: auto 0 0 0; width: 100%; max-width: none; max-height: 88dvh; margin: 0; padding: 0; border: 0; border-top: 1px solid var(--rule); border-radius: 12px 12px 0 0; background: var(--raised); color: var(--ink); overflow: hidden; }
dialog.sheet::backdrop { background: var(--scrim); }
.sheet-in { position: relative; width: min(100%, 36rem); max-height: 88dvh; margin-inline: auto; overflow-y: auto; padding: 1.25rem 1rem calc(1.25rem + var(--safe-b)); }
.sheet-in h2 { margin-right: 4.5rem; font-size: 1.25rem; font-weight: 600; line-height: 1.25; }
.sheet-in > p { margin-top: 0.375rem; }
.sheet-close { position: absolute; top: 0.625rem; right: 0.5rem; }

/* Calendar */
.cal-wrap { width: min(100% - 1rem, 80rem); margin-inline: auto; }
.cal-nav { display: flex; align-items: center; gap: 0.375rem; padding: 0 0.5rem 0.75rem; }
.cal-nav h2 { margin-right: auto; font-size: 1.25rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.cal { --n: 3; --gut: 2.75rem; }
.cal-head, .cal-allday, .cal-body { display: grid; grid-template-columns: var(--gut) repeat(var(--n), minmax(0, 1fr)); }
.cal-head { position: sticky; top: calc(var(--top) + var(--safe-t) + 1px); z-index: 8; background: var(--ground); border-bottom: 1px solid var(--rule); }
.dayhead { display: grid; justify-items: center; padding: 0.375rem 0 0.5rem; }
.dayhead .dn { color: var(--muted); font-size: 0.8125rem; text-transform: uppercase; letter-spacing: 0.04em; }
.dayhead .dd { display: grid; place-items: center; width: 2rem; height: 2rem; margin-top: 0.125rem; border-radius: 50%; font-size: 1.125rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.dayhead.today .dn { color: var(--ink); font-weight: 600; }
.dayhead.today .dd { background: var(--ink); color: var(--ground); }
.cal-allday { border-bottom: 1px solid var(--rule); }
.gut-lab { padding: 0.375rem 0.375rem 0 0; color: var(--muted); font-size: 0.8125rem; text-align: right; }
.adcell { display: grid; align-content: start; gap: 3px; min-width: 0; min-height: 2.25rem; padding: 3px 2px; border-left: 1px solid var(--rule); cursor: pointer; }
.chip { display: block; width: 100%; min-width: 0; min-height: 0; padding: 0.1875rem 0.375rem; border: 0; border-left: 3px solid var(--c, var(--ink)); border-radius: 0 4px 4px 0; background: var(--surface); background: color-mix(in srgb, var(--c, var(--ink)) 16%, var(--ground)); color: var(--ink); font-size: 0.8125rem; line-height: 1.3; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip.todo { background: var(--surface); border: 1px solid var(--rule); border-left: 3px solid var(--ink); }
.chip.urgent { font-weight: 600; }
.chip.done { opacity: 0.45; text-decoration: line-through; }
.hours { position: relative; height: calc(var(--hour) * 18); }
.hours span { position: absolute; right: 0.375rem; transform: translateY(-50%); color: var(--muted); font-size: 0.8125rem; white-space: nowrap; }
.col { position: relative; height: calc(var(--hour) * 18); border-left: 1px solid var(--rule); background-image: repeating-linear-gradient(to bottom, var(--rule) 0 1px, transparent 1px var(--hour)); cursor: pointer; }
.col.today { background-color: color-mix(in srgb, var(--ink) 3%, transparent); }
.blk { position: absolute; display: flex; flex-direction: column; min-height: 0; padding: 0.1875rem 0.375rem; overflow: hidden; border: 0; border-left: 3px solid var(--c); border-radius: 0 6px 6px 0; background: var(--surface); background: color-mix(in srgb, var(--c) 24%, var(--ground)); color: var(--ink); font-size: 0.8125rem; line-height: 1.25; text-align: left; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; }
.blk .bt { flex: none; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; font-weight: 600; overflow-wrap: anywhere; }
.blk.one .bt { -webkit-line-clamp: 1; }
.blk .bs { overflow: hidden; opacity: 0.8; white-space: nowrap; text-overflow: ellipsis; }
.blk.short { flex-direction: row; align-items: center; gap: 0.375rem; padding-block: 0; }
.blk.short .bt { display: block; flex: 0 1 auto; white-space: nowrap; text-overflow: ellipsis; }
.blk.short .bs { display: none; }
.blk.mine { --c: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-left: 3px solid var(--ink); }
.blk.done { opacity: 0.45; }
.blk.done .bt { text-decoration: line-through; }
.blk[data-drag] { cursor: grab; }
.blk.dragging { z-index: 20; cursor: grabbing; outline: 2px solid var(--ink); outline-offset: 1px; }
.now { position: absolute; left: 0; right: 0; z-index: 6; height: 2px; margin-top: -1px; background: var(--flag); pointer-events: none; }
.now::before { content: ""; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--flag); }
.cal-hint { padding: 0.75rem 0.5rem 0; }

@media (min-width: 900px) {
  .tabs, .fab { display: none; }
  .top h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .tabs-top { display: flex; align-self: stretch; gap: 0.25rem; margin-left: 1.25rem; }
  .tabs-top button { position: relative; padding: 0 0.75rem; background: none; border: 0; color: var(--muted); font-size: 0.9375rem; font-weight: 500; }
  .tabs-top button:hover { color: var(--ink); }
  .tabs-top button[aria-current="page"] { color: var(--ink); }
  .tabs-top button[aria-current="page"]::after { content: ""; position: absolute; left: 0.75rem; right: 0.75rem; bottom: -1px; height: 2px; background: var(--ink); }
  .add-top { display: inline-flex; align-items: center; }
  main { padding-bottom: 4rem; }
  .toast { bottom: 1.5rem; }
  .cal { --n: 7; --gut: 3.5rem; }
  .cal-wrap { width: min(100% - 2rem, 80rem); }
  dialog.sheet { inset: 0; width: min(100% - 2rem, 32rem); height: fit-content; margin: auto; border: 1px solid var(--rule); border-radius: 12px; }
}

@media (prefers-reduced-motion: no-preference) {
  .logo path { fill: transparent; stroke-width: 1.2; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 0.8s var(--ease) forwards, fill-in 0.35s 0.7s ease forwards; }
  .logo path + path { animation-delay: 0.15s, 0.85s; }
  .view { animation: fade-up 0.3s var(--ease); }
  dialog.sheet[open] { animation: sheet-up 0.25s var(--ease); }
}
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes fill-in { to { fill: var(--ink); stroke-width: 0; } }
@keyframes fade-up { from { opacity: 0.4; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes sheet-up { from { opacity: 0; transform: translateY(1.5rem); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<noscript><p class="wrap" style="padding:1.5rem 0">This preview has scripts turned off. Open the file in Safari or Chrome.</p></noscript>

<header class="top">
  <div class="top-in">
    <button type="button" class="logo" data-act="tab" data-tab="today" aria-label="Go to Today">
      <svg viewBox="0 0 64 40" aria-hidden="true">
        <path pathLength="1" fill-rule="evenodd" d="M4 4H18A16 16 0 0 1 18 36H4Z M10 10H18A10 10 0 0 1 18 30H10Z"/>
        <path pathLength="1" d="M38 4H44V17L54 4H61.5L49.8 19.6L61.5 36H54L44 22.8V36H38Z"/>
      </svg>
    </button>
    <h1 id="page-title">Today</h1>
    <nav class="tabs-top" aria-label="Sections">
      <button type="button" data-act="tab" data-tab="today">Today</button>
      <button type="button" data-act="tab" data-tab="calendar">Calendar</button>
      <button type="button" data-act="tab" data-tab="todo">To-do</button>
      <button type="button" data-act="tab" data-tab="classes">Classes</button>
      <button type="button" data-act="tab" data-tab="goals">Goals</button>
    </nav>
    <div class="top-actions">
      <button type="button" class="quiet" id="edit-btn" data-act="edit-today">Edit</button>
      <button type="button" class="outline add-top" data-act="add">+ Add</button>
    </div>
  </div>
</header>

<main>
  <section class="view wrap" id="view-today">
    <div class="hello"><h2 id="hello-day"></h2><p id="hello-sub"></p></div>
    <div id="cards"></div>
  </section>

  <section class="view cal-wrap" id="view-calendar" hidden>
    <div class="cal-nav">
      <h2 id="cal-range"></h2>
      <button type="button" class="outline" data-act="cal-today">Today</button>
      <button type="button" class="outline sq" data-act="cal-prev" aria-label="Earlier days">&lsaquo;</button>
      <button type="button" class="outline sq" data-act="cal-next" aria-label="Later days">&rsaquo;</button>
    </div>
    <div class="cal" id="cal"></div>
    <p class="hint cal-hint" id="cal-hint"></p>
  </section>

  <section class="view wrap" id="view-todo" hidden>
    <form id="todo-form" class="f todo-form" autocomplete="off">
      <label class="fl">New to-do
        <input name="text" required>
      </label>
      <div class="pair">
        <label class="fl">When
          <select name="when">
            <option value="today">Today</option>
            <option value="tomorrow">Tomorrow</option>
            <option value="date">Pick a day</option>
            <option value="someday">Someday</option>
          </select>
        </label>
        <label class="fl" id="todo-date-wrap" hidden>Day
          <input type="date" name="date">
        </label>
      </div>
      <div><button type="submit" class="outline">Add to-do</button></div>
    </form>
    <div id="todo-list"></div>
  </section>

const TYPES = { assignment: 'Assignment', quiz: 'Quiz', exam: 'Exam', project: 'Project' };
const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTHS_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const HOUR = 3600000;
const GRACE = 48 * HOUR; // a missed item stays flagged this long, then moves to Past
const MATH = 'MATH 1267';

/* ---------- Class meetings (shown as blocks on the calendar) ---------- */

const TERM_START = new Date(2026, 7, 24);
const TERM_END = new Date(2026, 11, 11);
const NO_CLASS = new Set(['2026-09-07', '2026-11-11', '2026-11-23', '2026-11-24', '2026-11-25', '2026-11-26', '2026-11-27']);
const CLASSES = [

  { course: 'BUS 2215', name: 'Managerial Accounting', days: [2, 4], start: '10:30', end: '11:50', room: 'BUS 003-305' },
  { course: 'BUS 3391', name: 'Information Systems', days: [], note: 'Class times not added yet. Tell Claude the days and times.' },
  { course: MATH, name: 'Business Calculus', days: [1, 3, 5], start: '13:00', end: '13:50', room: 'Erhart Agriculture 10-222' },
  { course: 'BUS 346', name: 'Principles of Marketing', days: [], note: 'Mon and Wed at 4:30 pm. End time and due dates not added yet: paste the Canvas Course Summary to Claude.' },
];

/* ---------- Small helpers ---------- */

const $ = id => document.getElementById(id);
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
function btn(text, cls, data, aria) {
  const b = el('button', cls, text);
  b.type = 'button';
  if (data) Object.keys(data).forEach(k => { if (data[k] != null) b.dataset[k] = data[k]; });
  if (aria) b.setAttribute('aria-label', aria);
  return b;
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const keyOf = it => it.course + '|' + it.title;
const inClass = it => it.due[3] == null;
// "In class" items count from 8:00 am, so the warning comes early rather than late.
const due = it => new Date(it.due[0], it.due[1] - 1, it.due[2], inClass(it) ? 8 : it.due[3], it.due[4]);
const byDue = (a, b) => due(a) - due(b);
const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const dayDiff = (d, now) => Math.round((startOfDay(d) - startOfDay(now)) / 86400000);
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const fromYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const mondayOf = d => addDays(startOfDay(d), -((d.getDay() + 6) % 7));
const toMin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + (m || 0); };
const fromMin = n => String(Math.floor(n / 60)).padStart(2, '0') + ':' + String(n % 60).padStart(2, '0');
const minOf = d => d.getHours() * 60 + d.getMinutes();

function clock(min, mer = true) {
  const h = Math.floor(min / 60) % 24, m = min % 60;
  return (h % 12 || 12) + ':' + String(m).padStart(2, '0') + (mer ? (h < 12 ? ' am' : ' pm') : '');
}
function shortTime(min) {
  const h = Math.floor(min / 60) % 24, m = min % 60;
  return (h % 12 || 12) + (m ? ':' + String(m).padStart(2, '0') : '') + (h < 12 ? 'am' : 'pm');
}
function rangeText(start, dur) {
  const end = start + dur;
  return (start < 720) === (end < 720) ? clock(start, false) + '–' + clock(end) : clock(start) + '–' + clock(end);
}
const fmtTime = d => clock(minOf(d));

function dayLabel(d, now) {
  const diff = dayDiff(d, now);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  if (diff === -1) return 'Yesterday';
  return DAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate();
}
function shortDay(d, now) {
  const diff = dayDiff(d, now);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Tomorrow';
  if (diff === -1) return 'Yesterday';
  if (diff > 1 && diff < 7) return DAYS[d.getDay()].slice(0, 3);
  return MONTHS[d.getMonth()] + ' ' + d.getDate();
}
function inSentence(d, now) {
  const label = dayLabel(d, now);
  return label === 'Today' || label === 'Tomorrow' || label === 'Yesterday' ? label.toLowerCase() : 'on ' + label;
}
function timeLeft(d, now) {
  const ms = Math.abs(d - now);
  const mins = Math.round(ms / 60000), hrs = Math.round(ms / HOUR);
  let s;
  if (mins < 60) s = mins + (mins === 1 ? ' minute' : ' minutes');
  else if (hrs < 48) s = hrs + (hrs === 1 ? ' hour' : ' hours');
  else {
    const days = Math.floor(hrs / 24), rest = hrs % 24;
    s = days + ' days' + (rest ? ' ' + rest + (rest === 1 ? ' hour' : ' hours') : '');
  }
  return d < now ? 'overdue by ' + s : 'due in ' + s;
}
const timeText = it => inClass(it) ? 'in class' : fmtTime(due(it));
const atTime = it => inClass(it) ? ', in class' : ' at ' + fmtTime(due(it));

// Exams and in-class quizzes happen once; they can't be turned in late.
const inPerson = it => it.type === 'exam' || it.course === MATH || /\bin class\b/i.test(it.notes || '');
function stillOverdue(it, now) {
  const d = due(it);
  return !it.done && !inPerson(it) && d < now && now - d < GRACE;
}

/* ---------- Storage ---------- */

let storageOk = true;
const CARRY = ['todos', 'goals', 'training', 'overrides', 'layout'];

function seedItems(deleted) {
  const skip = new Set(deleted);
  return SEED
    .map((s, i) => ({ id: 's' + i, course: s[0], title: s[1], type: s[2], due: s[3], notes: s[4], done: false }))
    .filter(it => !skip.has(keyOf(it)));
}

function load() {
  let stored = null;
  try { stored = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { storageOk = false; }
  if (stored && Array.isArray(stored.items) && stored.seedVersion >= SEED_VERSION) {
    stored.deleted = stored.deleted || [];
    return stored;
  }
  // First visit, or the file has newer starting data: write the seed,
  // keep done marks, keep items added by hand, and skip seed items deleted by hand.
  const deleted = (stored && stored.deleted) || [];
  const fresh = { seedVersion: SEED_VERSION, items: seedItems(deleted), deleted };
  if (stored) CARRY.forEach(k => { if (stored[k]) fresh[k] = stored[k]; });
  if (stored && Array.isArray(stored.items)) {
    const doneKeys = new Set(stored.items.filter(i => i.done).map(keyOf));
    fresh.items.forEach(i => { if (doneKeys.has(keyOf(i))) i.done = true; });
    const have = new Set(fresh.items.map(keyOf));
    stored.items.filter(i => (i.added || i.synced) && !have.has(keyOf(i))).forEach(i => fresh.items.push(i));
  }
  return fresh;
}

function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); storageOk = true; }
  catch (e) { storageOk = false; }
  const w = $('storage-warn');
  if (w) w.hidden = storageOk;
}

const CARD_IDS = ['soon', 'schedule', 'todo', 'workout', 'network', 'plan'];
const CARD_NAMES = { soon: 'Due soon', schedule: "Today's schedule", todo: 'To-do today', workout: 'Workout', network: 'Networking', plan: 'Plan my week' };

let state = load();
state.todos = state.todos || [];
state.goals = state.goals || { week: '', counts: {} };
state.training = state.training || { raceDate: '', done: {} };
state.training.done = state.training.done || {};
if (!state.training.raceDate) state.training.raceDate = '2026-11-08'; // Dale's race: Sunday, Nov 8
state.overrides = state.overrides || {};
state.layout = state.layout || { order: CARD_IDS.slice(), hidden: [] };
state.layout.order = (state.layout.order || []).filter(id => CARD_IDS.includes(id));
CARD_IDS.forEach(id => { if (!state.layout.order.includes(id)) state.layout.order.push(id); });
state.layout.hidden = (state.layout.hidden || []).filter(id => CARD_IDS.includes(id));
save();

/* ---------- Courses ---------- */

function courseOrder() {
  const seen = [];
  const add = c => { if (!seen.includes(c)) seen.push(c); };
  SEED.forEach(s => add(s[0]));
  state.items.forEach(i => add(i.course));
  CLASSES.forEach(c => add(c.course));
  return seen;
}
const colorFor = course => 'var(--c' + ((courseOrder().indexOf(course) % 6) + 1) + ')';

/* ---------- Weekly goals ---------- */

const GOALS = [
  { id: 'connect', label: 'Connect with relevant people', short: 'connections', target: 5, plan: 'Connect with 5 relevant people',
    step: n => 'connect with ' + n + (n === 1 ? ' person' : ' people') },
  { id: 'coffee', label: 'Message people for a coffee chat', short: 'coffee-chat messages', target: 2, plan: 'Message 2 people for a coffee chat',
    step: n => 'message ' + n + (n === 1 ? ' person' : ' people') + ' for a coffee chat' },
  { id: 'apply', label: 'Apply to internships', short: 'applications', target: 3, plan: 'Apply to 3 internships',
    step: n => 'apply to ' + n + (n === 1 ? ' internship' : ' internships') },
];

function currentGoals(now) {
  const g = state.goals;
  const week = ymd(mondayOf(now));
  if (g.week !== week) {
    if (g.week) g.last = { week: g.week, counts: g.counts };
    g.week = week;
    g.counts = {};
    save();
  }
  return g;
}

// Spread each goal across the week: by today you should be at
// round(target * days so far / 7). Today's step is the gap to that pace.
function networkingToday(now) {
  const g = currentGoals(now);
  const daysIn = ((now.getDay() + 6) % 7) + 1;
  if (GOALS.every(x => (g.counts[x.id] || 0) >= x.target)) return 'Networking goals done for this week.';
  const steps = GOALS.map(x => {
    const need = Math.round(x.target * daysIn / 7) - (g.counts[x.id] || 0);
    return need > 0 ? x.step(need) : null;
  }).filter(Boolean);
  if (!steps.length) return 'On pace. Nothing needed today.';
  return cap(steps.join(', ')) + '.';
}

/* ---------- Training ---------- */

const RUN_WEEK = {
  1: 'Easy run, 30 to 40 min.',
  2: 'Intervals: 10 min easy, 6 × 2 min hard with 2 min easy jogs, 10 min easy.',
  3: 'Easy run, 30 min, then 15 min core and mobility.',
  4: 'Tempo: 10 min easy, 20 min comfortably hard, 10 min easy.',
  5: 'Rest.',
  6: 'Long run, 50 to 70 min at an easy pace.',
  0: 'Rest, or a 20 min easy jog.',
};
const LIFT_A = 'Lift A: squat 3×8, bench press 3×8, dumbbell row 3×10, plank 3 × 30 sec.';
const LIFT_B = 'Lift B: Romanian deadlift 3×8, overhead press 3×8, lat pulldown 3×10, lunges 3×10 each leg.';
const LIFT_WEEK = { 2: 'Easy run, 20 to 30 min, or rest.', 4: 'Rest.', 6: 'Easy run or hike, 30 to 45 min.', 0: 'Rest.' };
const LIFT_DAYS = [1, 3, 5];
const isRest = t => t.startsWith('Rest') || t.startsWith('Recovery');

function firstLiftDay(race) {
  let d = addDays(race, 4);
  while (!LIFT_DAYS.includes(d.getDay())) d = addDays(d, 1);
  return d;
}

function workoutFor(day) {
  const wd = day.getDay();
  const r = state.training.raceDate;
  if (r) {
    const race = fromYmd(r);
    const diff = dayDiff(day, race);
    if (diff === 0) return { text: 'Race day. Warm up 10 min easy, then race.' };
    if (diff === -1) return { text: 'Rest. Lay out your gear and sleep early.' };
    if (diff === -2) return { text: 'Easy run, 15 to 20 min, plus 4 short strides.' };
    if (diff >= -6 && diff <= -3) return { text: wd === 5 ? 'Rest.' : 'Easy run, 20 to 30 min. Race week: keep it easy.' };
    if (diff >= 1 && diff <= 3) return { text: 'Recovery. Rest or an easy 20 min walk.' };
    if (diff >= 4) {
      if (!LIFT_DAYS.includes(wd)) return { text: LIFT_WEEK[wd] };
      let k = 0;
      for (let d = firstLiftDay(race); d < startOfDay(day); d = addDays(d, 1)) if (LIFT_DAYS.includes(d.getDay())) k++;
      return { text: k % 2 === 0 ? LIFT_A : LIFT_B };
    }
  }
  return { text: RUN_WEEK[wd] };
}

function trainingPhase(now) {
  const r = state.training.raceDate;
  if (!r) return 'Running block. Set your race date and lifting starts a few days after it.';
  const race = fromYmd(r);
  const diff = dayDiff(now, race);
  const raceText = DAYS[race.getDay()] + ', ' + MONTHS[race.getMonth()] + ' ' + race.getDate();
  if (diff < -6) return 'Running block until your race on ' + raceText + '.';
  if (diff < 0) return 'Race week. Race on ' + raceText + '. Keep every run easy.';
  if (diff === 0) return 'Race day. Go get it.';
  if (diff <= 3) return 'Recovery after your race. Lifting starts ' + inSentence(firstLiftDay(race), now) + '.';
  return 'Strength block: lift Monday, Wednesday, Friday. Start light, and add 5 lb when every set feels solid.';
}

// How a workout sits on the calendar: a short title, a length, and a usual start.
function workoutMeta(text) {
  const title = text.split(/[:,.]/)[0].trim();
  let dur = 45;
  if (/long run/i.test(text)) dur = 75;
  else if (/^lift/i.test(text)) dur = 60;
  else if (/intervals|tempo|core/i.test(text)) dur = 50;
  else if (/race day/i.test(text)) dur = 120;
  else if (/15 to 20|20 to 30/.test(text)) dur = 30;
  const start = /long run|hike|race day/i.test(text) ? 8 * 60 : 7 * 60;
  return { title, dur, start };
}

/* ---------- Calendar blocks ---------- */

function classesOn(day) {
  if (day < TERM_START || day > TERM_END || NO_CLASS.has(ymd(day))) return [];
  return CLASSES.filter(c => c.days.includes(day.getDay())).map(c => ({
    kind: 'class', id: 'c:' + c.course + ':' + ymd(day), course: c.course, title: c.course, sub: c.room,
    date: ymd(day), start: toMin(c.start), dur: toMin(c.end) - toMin(c.start), cls: c,
  }));
}

// Workouts and the networking block. Each can be moved; the move is saved per day.
function routineFor(day) {
  const key = ymd(day);
  const out = [];
  const w = workoutFor(day);
  if (!isRest(w.text)) {
    const m = workoutMeta(w.text);
    out.push({ kind: 'workout', id: 'w:' + key, origin: key, title: m.title, text: w.text, date: key,
      start: m.start, defStart: m.start, dur: m.dur, done: !!state.training.done[key] });
  }
  if (day.getDay() >= 1 && day.getDay() <= 5) {
    out.push({ kind: 'network', id: 'n:' + key, origin: key, title: 'Networking', date: key,
      start: 19 * 60 + 30, defStart: 19 * 60 + 30, dur: 20, done: false });
  }
  out.forEach(b => {
    const o = state.overrides[b.id];
    if (o) { b.date = o.date; b.start = o.start; b.moved = true; }
  });
  return out;
}

function blocksIn(first, n) {
  const firstKey = ymd(first), lastKey = ymd(addDays(first, n - 1));
  const out = [];
  for (let i = -7; i < n + 7; i++) routineFor(addDays(first, i)).forEach(b => out.push(b));
  for (let i = 0; i < n; i++) classesOn(addDays(first, i)).forEach(b => out.push(b));
  state.todos.forEach(t => {
    if (t.time && t.date) out.push({ kind: 'todo', id: 't:' + t.id, todo: t, title: t.text, date: t.date,
      start: toMin(t.time), dur: t.dur || 60, done: t.done });
  });
  return out.filter(b => b.date >= firstKey && b.date <= lastKey);
}

// Side-by-side columns for blocks that overlap.
function layoutDay(blocks) {
  blocks.sort((a, b) => a.start - b.start || b.dur - a.dur);
  let cluster = [], end = -1;
  const flush = () => {
    const cols = [];
    cluster.forEach(b => {
      let i = cols.findIndex(e => e <= b.start);
      if (i < 0) { i = cols.length; cols.push(0); }
      cols[i] = b.start + Math.max(b.dur, 25);
      b.col = i;
    });
    cluster.forEach(b => { b.cols = cols.length; });
    cluster = [];
  };
  blocks.forEach(b => {
    if (b.start >= end) { flush(); end = -1; }
    cluster.push(b);
    end = Math.max(end, b.start + Math.max(b.dur, 25));
  });
  flush();
}

function alldayFor(key, now) {
  const dues = state.items.filter(i => ymd(due(i)) === key).sort(byDue).map(i => ({ kind: 'due', item: i }));
  const todos = state.todos.filter(t => t.date === key && !t.time).map(t => ({ kind: 'todo', todo: t }));
  return dues.concat(todos);
}

function soonItems(now) {
  const limit = new Date(now.getTime() + 72 * HOUR);
  return state.items.filter(it => (!it.done && due(it) > now && due(it) <= limit) || stillOverdue(it, now)).sort(byDue);
}

// Everything on one day, in time order, for the Today schedule.
function agendaFor(day) {
  const key = ymd(day);
  const list = blocksIn(startOfDay(day), 1).map(b => Object.assign({ sortMin: b.start }, b));
  state.items.filter(i => ymd(due(i)) === key).forEach(i => list.push({
    kind: 'due', id: i.id, item: i, title: i.title, course: i.course,
    start: inClass(i) ? null : minOf(due(i)), sortMin: inClass(i) ? 8 * 60 : minOf(due(i)), done: i.done,
  }));
  return list.sort((a, b) => a.sortMin - b.sortMin);
}

/* ---------- To-do helpers ---------- */

function todoGroup(t, now) {
  if (!t.date) return 'someday';
  if (t.date <= ymd(now)) return 'today';
  const diff = dayDiff(fromYmd(t.date), now);
  if (diff === 1) return 'tomorrow';
  if (diff <= 6) return 'week';
  return 'later';
}
const showTodo = (t, now) => !t.done || t.doneOn === ymd(now); // finished on an earlier day: hide
function todoSort(a, b) {
  const da = a.date || '9999', db = b.date || '9999';
  if (da !== db) return da < db ? -1 : 1;
  const ta = a.time || '', tb = b.time || '';
  if (ta !== tb) return ta < tb ? -1 : 1;
  return a.id < b.id ? -1 : 1;
}
const todosFor = (group, now) => state.todos.filter(t => showTodo(t, now) && todoGroup(t, now) === group).sort(todoSort);

/* ---------- Rows ---------- */

function dueRow(it, now, opts = {}) {
  const d = due(it);
  const li = el('li', 'row' + (it.done ? ' done' : ''));

  li.appendChild(el('span', 'bar'));

  main.appendChild(el('span', 't', it.title));
  main.appendChild(el('span', 'm', it.course + ' · ' + (TYPES[it.type] || 'Assignment')));
  if (opts.left && !it.done) main.appendChild(el('span', 'left', cap(timeLeft(d, now))));
  li.appendChild(main);
  const when = inClass(it) ? 'in class' : fmtTime(d);
  li.appendChild(el('span', 'r', opts.dayTime ? shortDay(d, now) + (inClass(it) ? ', ' : ' ') + when : cap(when)));

}

function todoRow(t, now) {
  const li = el('li', 'row trow' + (t.done ? ' done' : ''));
  const c = btn('', 'check', { act: 'todo-toggle', id: t.id }, (t.done ? 'Mark not done: ' : 'Mark done: ') + t.text);
  c.setAttribute('role', 'checkbox');

  li.appendChild(c);
  const main = btn('', 'main', { act: 'open', kind: 'todo', id: 't:' + t.id });
  main.appendChild(el('span', 't', t.text));
  const bits = [];
  const today = ymd(now);
  if (t.date && t.date < today) bits.push('From ' + shortDay(fromYmd(t.date), now));
  else if (t.date && dayDiff(fromYmd(t.date), now) > 1) bits.push(dayLabel(fromYmd(t.date), now));
  if (t.time) bits.push(rangeText(toMin(t.time), t.dur || 60));
  if (bits.length) main.appendChild(el('span', 'm', bits.join(' · ')));
  li.appendChild(main);
  return li;
}

function agendaRow(x, now) {
  const li = el('li', 'row arow' + (x.done ? ' done' : ''));
  const mine = x.kind === 'workout' || x.kind === 'network' || x.kind === 'todo';
  li.style.setProperty('--c', mine ? 'var(--ink)' : colorFor(x.course));
  if (x.kind !== 'due' && x.start + (x.dur || 0) < minOf(now)) li.classList.add('past');
  li.appendChild(el('span', 'time', x.start == null ? 'Class' : clock(x.start)));
  li.appendChild(el('span', 'bar'));
  const main = btn('', 'main', { act: 'open', kind: x.kind, id: x.id });
  main.appendChild(el('span', 't', x.title));
  let meta = '';
  if (x.kind === 'class') meta = rangeText(x.start, x.dur) + ' · ' + x.sub;
  else if (x.kind === 'workout') meta = x.text;
  else if (x.kind === 'network') meta = networkingToday(now);
  else if (x.kind === 'todo') meta = 'To-do · ' + rangeText(x.start, x.dur);
  else meta = x.course + ' · ' + (TYPES[x.item.type] || 'Assignment') + ' due';
  main.appendChild(el('span', 'm', meta));
  li.appendChild(main);
  return li;
}

function nowRow(now) {
  const li = el('li', 'nowrow', clock(minOf(now)));
  li.setAttribute('aria-label', 'Now, ' + clock(minOf(now)));
  return li;
}

function quickAdd(placeholder) {
  const f = el('form', 'qadd');

  i.name = 'text';
  i.placeholder = placeholder;

    render();
    toast('Added to today.');
  });

}

    sec.appendChild(row);

    const p = buildPlan();

function moveCard(id, dir) {
  const order = state.layout.order;
  const visible = order.filter(x => !state.layout.hidden.includes(x));
  const i = visible.indexOf(id), j = i + dir;
  if (i < 0 || j < 0 || j >= visible.length) return;
  const a = order.indexOf(visible[i]), b = order.indexOf(visible[j]);
  [order[a], order[b]] = [order[b], order[a]];
}

function renderToday(now) {
  const soon = soonItems(now);
  const left = state.todos.filter(t => !t.done && t.date && t.date <= ymd(now)).length;
  $('hello-day').textContent = DAYS[now.getDay()];
  $('hello-sub').textContent = MONTHS_LONG[now.getMonth()] + ' ' + now.getDate() + ' · '
    + (soon.length ? soon.length + ' due in the next 72 hours' : 'nothing due in the next 72 hours')
    + ' · ' + left + (left === 1 ? ' to-do' : ' to-dos') + ' today';
  const box = $('cards');
  box.textContent = '';
  box.classList.toggle('editing', editing);
  const visible = state.layout.order.filter(id => !state.layout.hidden.includes(id));
  if (editing) box.appendChild(el('p', 'hint', 'Move sections up or down, or hide the ones you don’t need. Tap Done at the top when you’re finished.'));
  visible.forEach((id, i) => {
    const sec = el('section', 'sec');
    const head = el('div', 'sec-head');
    head.appendChild(el('h2', null, CARD_NAMES[id]));

    if (editing) {
      const ctl = el('div', 'card-ctl');
      if (i > 0) ctl.appendChild(btn('Up', 'quiet', { act: 'card-up', card: id }, 'Move ' + CARD_NAMES[id] + ' up'));
      if (i < visible.length - 1) ctl.appendChild(btn('Down', 'quiet', { act: 'card-down', card: id }, 'Move ' + CARD_NAMES[id] + ' down'));
      ctl.appendChild(btn('Hide', 'quiet', { act: 'card-hide', card: id }, 'Hide ' + CARD_NAMES[id]));
      head.appendChild(ctl);
    }
    CARD_RENDER[id](sec, head, now, soon);

      const li = el('li', 'row');

      li.appendChild(el('span', 't', CARD_NAMES[id]));

      ul.appendChild(li);
    });
    sec.appendChild(ul);
    box.appendChild(sec);
  }
}

/* ---------- Calendar ---------- */

const START_H = 6, END_H = 24, PX = 52 / 60;
let calStart = null;

const calDays = () => (innerWidth >= 900 ? 7 : 3);
function calFirst(now) {
  const s = startOfDay(calStart || now);
  return calDays() === 7 ? mondayOf(s) : s;
}
function shiftCal(dir) {
  calStart = addDays(calFirst(new Date()), dir * calDays());
  render();
}
function rangeLabel(first, n) {
  const last = addDays(first, n - 1);
  return MONTHS[first.getMonth()] + ' ' + first.getDate() + ' – '
    + (last.getMonth() === first.getMonth() ? '' : MONTHS[last.getMonth()] + ' ') + last.getDate();
}

function chip(x, now) {
  if (x.kind === 'due') {
    const it = x.item;
    const urgent = !it.done && ((due(it) > now && due(it) - now <= 72 * HOUR) || stillOverdue(it, now));
    const c = btn((inClass(it) ? 'In class' : shortTime(minOf(due(it)))) + ' ' + it.title,
      'chip' + (it.done ? ' done' : '') + (urgent ? ' urgent' : ''), { act: 'open', kind: 'due', id: it.id },
      it.course + ' ' + it.title + ', due ' + timeText(it));
    c.style.setProperty('--c', colorFor(it.course));
    return c;
  }
  const t = x.todo;
  return btn(t.text, 'chip todo' + (t.done ? ' done' : ''), { act: 'open', kind: 'todo', id: 't:' + t.id }, 'To-do: ' + t.text);
}

function blockEl(b, now) {
  const mine = b.kind !== 'class';
  const e = btn('', 'blk' + (mine ? ' mine' : '') + (b.done ? ' done' : ''), { act: 'open', kind: b.kind, id: b.id });
  if (!mine) e.style.setProperty('--c', colorFor(b.course));
  const top = Math.max(0, (b.start - START_H * 60) * PX);
  const h = Math.max(b.dur * PX, 22);
  e.style.top = top + 'px';
  e.style.height = (h - 2) + 'px';
  e.style.left = 'calc(' + (b.col / b.cols * 100) + '% + 2px)';
  e.style.width = 'calc(' + (100 / b.cols) + '% - 4px)';
  if (h < 36) e.classList.add('short');
  else if (h < 64) e.classList.add('one');
  e.appendChild(el('span', 'bt', b.title));
  e.appendChild(el('span', 'bs', b.kind === 'class' && h >= 50 ? rangeText(b.start, b.dur) + ' · ' + b.sub : rangeText(b.start, b.dur)));
  if (b.kind !== 'class') {
    e.dataset.drag = '1';
    e.dataset.date = b.date;
    e.dataset.start = b.start;
    e.dataset.dur = b.dur;
  }
  e.setAttribute('aria-label', b.title + ', ' + dayLabel(fromYmd(b.date), now) + ', ' + rangeText(b.start, b.dur));
  return e;
}

function renderCalendar(now) {
  const n = calDays(), first = calFirst(now);
  const root = $('cal');
  root.style.setProperty('--n', n);
  root.textContent = '';
  $('cal-range').textContent = rangeLabel(first, n);
  $('cal-hint').textContent = matchMedia('(hover: hover)').matches
    ? 'Click an empty spot to add something at that time. Drag your own items to move them.'
    : 'Tap an empty spot to add something. Press and hold your own items to drag them. Swipe to see more days.';
  const days = Array.from({ length: n }, (_, i) => addDays(first, i));
  const todayKey = ymd(now);

  const head = el('div', 'cal-head');
  head.appendChild(el('div'));
  days.forEach(d => {
    const h = el('div', 'dayhead' + (ymd(d) === todayKey ? ' today' : ''));
    h.append(el('span', 'dn', DAYS[d.getDay()].slice(0, 3)), el('span', 'dd', String(d.getDate())));
    head.appendChild(h);
  });

  const ad = el('div', 'cal-allday');
  ad.appendChild(el('div', 'gut-lab', 'Due'));
  days.forEach(d => {
    const cell = el('div', 'adcell');
    cell.dataset.date = ymd(d);
    alldayFor(ymd(d), now).forEach(x => cell.appendChild(chip(x, now)));
    ad.appendChild(cell);
  });

  const body = el('div', 'cal-body');
  const hours = el('div', 'hours');
  for (let h = START_H + 1; h < END_H; h++) {
    const s = el('span', null, (h % 12 || 12) + (h < 12 ? ' am' : ' pm'));
    s.style.top = (h - START_H) * 60 * PX + 'px';
    hours.appendChild(s);
  }
  body.appendChild(hours);
  const blocks = blocksIn(first, n);
  days.forEach(d => {
    const key = ymd(d);
    const col = el('div', 'col' + (key === todayKey ? ' today' : ''));
    col.dataset.date = key;
    const mine = blocks.filter(b => b.date === key);
    layoutDay(mine);
    mine.forEach(b => col.appendChild(blockEl(b, now)));
    if (key === todayKey && minOf(now) >= START_H * 60) {
      const line = el('div', 'now');
      line.style.top = (minOf(now) - START_H * 60) * PX + 'px';
      col.appendChild(line);
    }
    body.appendChild(col);
  });
  root.append(head, ad, body);
}

function scrollCalToNow() {
  const body = document.querySelector('#cal .cal-body');
  if (!body) return;
  const now = new Date();
  const off = dayDiff(now, calFirst(now));
  const target = off >= 0 && off < calDays() ? Math.max(minOf(now) - 90, START_H * 60) : 7 * 60;
  const headH = document.querySelector('.top').offsetHeight + document.querySelector('#cal .cal-head').offsetHeight;
  const y = body.getBoundingClientRect().top + scrollY + (target - START_H * 60) * PX - headH;
  scrollTo(0, Math.max(0, y));
}

/* Dragging your own blocks: mouse drags right away; a finger presses and holds first. */
let drag = null, suppressClick = false, swipe = null;

function beginDrag(target, x, y, type) {
  const r = target.getBoundingClientRect();
  drag = { el: target, type, x0: x, y0: y, grabY: y - r.top, kind: target.dataset.kind, id: target.dataset.id,
    dur: Number(target.dataset.dur), origDate: target.dataset.date, origStart: Number(target.dataset.start),
    date: target.dataset.date, start: Number(target.dataset.start), active: false, timer: 0 };
}
function startDrag() {
  if (!drag) return;
  clearTimeout(drag.timer);
  drag.active = true;
  drag.cols = [...document.querySelectorAll('#cal .col')];
  drag.el.classList.add('dragging');
  if (navigator.vibrate) navigator.vibrate(10);
}
function moveDrag(x, y) {
  const cols = drag.cols;
  let col = cols.find(c => { const r = c.getBoundingClientRect(); return x >= r.left && x < r.right; });
  if (!col) col = x < cols[0].getBoundingClientRect().left ? cols[0] : cols[cols.length - 1];
  if (drag.el.parentNode !== col) col.appendChild(drag.el);
  const r = col.getBoundingClientRect();
  let min = Math.round((START_H * 60 + (y - r.top - drag.grabY) / PX) / 15) * 15;
  min = Math.max(START_H * 60, Math.min(END_H * 60 - 15, min));
  drag.date = col.dataset.date;
  drag.start = min;
  Object.assign(drag.el.style, { top: (min - START_H * 60) * PX + 'px', left: '2px', width: 'calc(100% - 4px)' });
  const s = drag.el.querySelector('.bs');
  if (s) s.textContent = rangeText(min, drag.dur);
  if (y < 120) scrollBy(0, -12);
  else if (y > innerHeight - 150) scrollBy(0, 12);
}
function commitMove(d) {
  if (d.kind === 'todo') {
    const t = state.todos.find(x => 't:' + x.id === d.id);
    if (t) { t.date = d.date; t.time = fromMin(d.start); }
  } else {
    const b = routineFor(fromYmd(d.id.slice(2))).find(x => x.id === d.id);
    if (!b) return;
    if (d.date === b.origin && d.start === b.defStart) delete state.overrides[d.id];
    else state.overrides[d.id] = { date: d.date, start: d.start };
  }
  save();
}
function endDrag() {
  const d = drag;
  drag = null;

  }

}

/* ---------- Plan my week ---------- */

function advice(it, blunt) {
  const morning = due(it).getHours() < 12;
  if (it.type === 'exam') return blunt ? 'Exam. Review the night before, sleep, show up early.' : 'Exam day. Rest the night before; you have prepared for this.';
  if (it.type === 'project') return blunt ? 'Submit early. Late work is not accepted.' : 'Aim to submit with time to spare.';
  if (morning) return blunt ? 'Due in the morning. Finish it the night before.' : 'Due in the morning, so wrap it up the evening before.';
  return blunt ? "Don't leave it for 11 pm." : 'Give yourself a buffer before the deadline.';
}

function buildPlan() {
  const now = new Date();
  const today = startOfDay(now);
  const end = addDays(today, 7);
  const blunt = TONE === 'blunt';
  const name = it => it.course + ' ' + it.title;
  const open = state.items.filter(i => !i.done).sort(byDue);
  const overdue = open.filter(i => stillOverdue(i, now));
  const week = open.filter(i => due(i) >= now && due(i) < end);
  const big = open.filter(i => (i.type === 'exam' || i.type === 'project') && due(i) >= now && due(i) < addDays(today, 14));
  const exams = week.filter(i => i.type === 'exam').length;

  let intro;
  if (!week.length) intro = blunt ? 'Nothing due in the next 7 days. Get ahead on what is next.' : 'A clear week. A good time to get ahead.';
  else {
    const things = week.length + (week.length === 1 ? ' thing' : ' things');
    const examPart = exams ? ', ' + exams + (exams === 1 ? ' of them an exam' : ' of them exams') : '';
    intro = blunt ? things + ' due in the next 7 days' + examPart + '.' : 'You have ' + things + ' coming up this week' + examPart + '. One day at a time.';
  }

  const blocks = [];
  blocks.push({ h: 'Goals this week', lines: GOALS.map(g => g.plan + '.').concat("Start with Cal Poly alumni and people you've met in person.") });
  if (overdue.length) {
    blocks.push({ h: 'Overdue', lines: overdue.map(i => blunt
      ? name(i) + ' was due ' + shortDay(due(i), now) + atTime(i) + '. Submit it now or email your professor today.'
      : name(i) + ' slipped past its due date. If it can still go in, start there.') });
  }
  if (big.length) {
    blocks.push({ h: 'Start now', lines: big.map(i => {
      const days = dayDiff(due(i), now);
      const when = inSentence(due(i), now) + atTime(i);
      return blunt
        ? name(i) + ' is ' + when + '. ' + (days <= 1 ? 'That is basically now.' : days + ' days out. Study a little every day until then.')
        : name(i) + ' is ' + when + '. A short review each day will carry you.';
    }) });
  }
  for (let n = 0; n < 7; n++) {
    const day = addDays(today, n);
    const key = ymd(day);
    const items = week.filter(i => dayDiff(due(i), day) === 0);
    let lines;
    if (items.length) {
      lines = items.map(i => cap(timeText(i)) + ' · ' + name(i) + '. ' + advice(i, blunt));
    } else {
      const next = open.find(i => due(i) >= addDays(day, 1));
      lines = [next
        ? (blunt ? 'Nothing due. Get ahead on ' + name(next) + '.' : 'Nothing due. A good day to chip away at ' + name(next) + '.')
        : (blunt ? 'Nothing due.' : 'Nothing due. Rest up.')];
    }
    lines.unshift('Workout: ' + workoutFor(day).text);
    state.todos
      .filter(t => !t.done && (t.date === key || (n === 0 && t.date && t.date < key)))
      .sort(todoSort)
      .forEach(t => lines.push('To-do: ' + (t.time ? clock(toMin(t.time)) + ' · ' : '') + t.text));
    blocks.push({ h: dayLabel(day, now), lines });
  }
  const outro = blunt ? 'Open this again next Sunday.' : 'Nice work planning ahead. See you next Sunday.';
  return { intro, blocks, outro };
}

function planText(p) {
  const out = [p.intro, ''];
  p.blocks.forEach(b => { out.push(b.h); b.lines.forEach(l => out.push('- ' + l)); out.push(''); });
  out.push(p.outro);
  return out.join('\n');
}

async function copyPlan() {
  try {
    await navigator.clipboard.writeText(lastPlan);
    toast('Plan copied.');
  } catch (e) {
    const ta = el('textarea');
    ta.value = lastPlan;
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
    ta.remove();
    toast(ok ? 'Plan copied.' : "Copy didn't work here. Select the plan and copy it by hand.");
  }
}

/* ---------- Math course sheet (read live when online) ---------- */

const SHEET_ID = '1ZNvghKpYX571ga_KQxiuFbBQWPIQYW-_dOMlUlSD-a4';
const SHEET_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/edit';
const SYNC_KEY = 'life-crm-math';
const TERM_YEAR = 2026;
const MATH_HOUR = 13; // class starts at 1:00 pm
const MONTH_NUM = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
const DATE_RE = /^(?:mon|tue|wed|thu|fri|sat|sun)[a-z]*,?\s+([a-z]+)\.?\s+(\d{1,2})$/i;

let mathCache = null;
try { mathCache = JSON.parse(localStorage.getItem(SYNC_KEY)); } catch (e) { mathCache = null; }
let syncState = 'loading';

// Google blocks plain requests from a double-clicked file, so this uses the
// script-tag form of Google's own sheet API. It only reads the public sheet.
function readSheet(name) {
  return new Promise((resolve, reject) => {
    const cb = '__sheet_' + Math.random().toString(36).slice(2);
    const tag = document.createElement('script');
    const timer = setTimeout(() => { done(); reject(new Error('timeout')); }, 10000);
    function done() { clearTimeout(timer); delete window[cb]; tag.remove(); }
    window[cb] = data => {
      done();
      if (!data || data.status !== 'ok' || !data.table) { reject(new Error('bad response')); return; }
      resolve(data.table.rows.map(r => (r.c || []).map(c => c == null ? '' : String(c.f != null ? c.f : (c.v != null ? c.v : '')).trim())));
    };
    tag.onerror = () => { done(); reject(new Error('network')); };
    tag.src = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?headers=0'
      + '&tqx=' + encodeURIComponent('out:json;responseHandler:' + cb)
      + '&sheet=' + encodeURIComponent(name) + '&t=' + Date.now();
    document.head.appendChild(tag);
  });
}

const cell = (r, i) => (i >= 0 && r[i] != null ? String(r[i]).trim() : '');
const label = t => t.toLowerCase().replace(/\s+/g, ' ');

function parseCalendar(rows) {
  let planCol = -1, testCol = -1, hwcCol = -1, dateCol = -1;
  rows.forEach(r => r.forEach((v, i) => {
    if (v === 'Class Plan') planCol = i;
    if (v === 'Quiz & Exam Sections' || (v === 'Assessments' && testCol < 0)) testCol = i;
    if (v === 'Homework Check Sections') hwcCol = i;
  }));
  for (const r of rows) {
    const i = r.findIndex(v => DATE_RE.test(v));
    if (i >= 0) { dateCol = i; break; }
  }
  if (planCol < 0 || dateCol < 0) throw new Error('calendar layout changed');
  const covers = {};
  let curTest = null, curHwc = null;
  const events = [];
  rows.forEach(r => {
    const m = DATE_RE.exec(cell(r, dateCol));
    const t = cell(r, testCol), h = cell(r, hwcCol);
    if (/^(quiz|exam)\s*\d+$/i.test(t)) { curTest = label(t); covers[curTest] = []; }
    else if (t && curTest && m) covers[curTest].push(t);
    if (/^hwc\s*\d+$/i.test(h)) { curHwc = label(h); covers[curHwc] = []; }
    else if (h && curHwc && m) covers[curHwc].push(h);
    if (!m) return;
    const month = MONTH_NUM[m[1].slice(0, 3).toLowerCase()];
    if (!month) return;
    const re = /\b(quiz|hwc|exam)\s*(\d+)\b/gi;
    let x;
    while ((x = re.exec(cell(r, planCol)))) {
      const kind = x[1].toLowerCase();
      events.push({
        key: kind + ' ' + x[2],
        title: (kind === 'hwc' ? 'Homework Check ' : kind === 'quiz' ? 'Quiz ' : 'Exam ') + x[2],
        type: kind === 'exam' ? 'exam' : 'quiz',
        due: [TERM_YEAR, month, Number(m[2]), MATH_HOUR, 0],
      });
    }
  });
  events.forEach(ev => {
    const base = ev.key.startsWith('hwc') ? MATH_HWC : ev.key.startsWith('quiz') ? MATH_QUIZ : 'In class, room 10-222. Bring a scientific calculator.';
    const sec = covers[ev.key] && covers[ev.key].length ? 'Covers ' + covers[ev.key].join(', ') + '. ' : '';
    ev.notes = sec + base;
    delete ev.key;
  });
  return events;
}

function parseHomework(rows) {
  const hi = rows.findIndex(r => r.includes('Section') && r.some(v => /^homework/i.test(v)));
  if (hi < 0) throw new Error('homework layout changed');
  const head = rows[hi].map(v => v.toLowerCase());
  const sec = head.indexOf('section'), top = head.indexOf('topics');
  const hw = head.findIndex(v => v.startsWith('homework')), ex = head.findIndex(v => v.startsWith('suggested'));
  return rows.slice(hi + 1)
    .map(r => ({ section: cell(r, sec), topic: cell(r, top), problems: cell(r, hw), examples: cell(r, ex) }))
    .filter(x => /^\d+\.\d+$/.test(x.section) && x.problems);
}

const baseTitle = t => t.replace(/ \(date tentative\)$/, '');

// Put the sheet's dates into the planner. Done marks stay; deleted items stay deleted.
function applyMath(data) {
  if (!data || !Array.isArray(data.events)) return;
  const now = new Date();
  const gone = new Set(state.deleted.map(baseTitle));
  data.events.forEach(ev => {
    if (gone.has(MATH + '|' + ev.title)) return;
    const it = state.items.find(i => i.course === MATH && baseTitle(i.title) === ev.title);
    if (it) {
      Object.assign(it, { title: ev.title, type: ev.type, due: ev.due, notes: ev.notes });
    } else if (due(ev) >= now) {
      state.items.push({ id: 'm-' + ev.title.toLowerCase().replace(/\W+/g, '-'), course: MATH, title: ev.title,
        type: ev.type, due: ev.due, notes: ev.notes, done: false, synced: true });
    }
  });
  save();
}

async function syncMath() {
  try {
    const [cal, hw] = await Promise.all([readSheet('Course Calendar'), readSheet('HW & Course Content')]);
    mathCache = { at: Date.now(), events: parseCalendar(cal), homework: parseHomework(hw) };
    try { localStorage.setItem(SYNC_KEY, JSON.stringify(mathCache)); } catch (e) { /* page still works */ }
    syncState = 'ok';
    applyMath(mathCache);
  } catch (e) {
    syncState = 'offline';
  }
  render();
}

function stamp(ts, now) {
  const d = new Date(ts);
  return (dayDiff(d, now) === 0 ? 'today' : MONTHS[d.getMonth()] + ' ' + d.getDate()) + ' at ' + fmtTime(d);
}

function renderMathInto(sec, now) {
  sec.appendChild(el('h3', 'sub-h', 'Homework'));
  const line = el('p', 'hint');
  let msg;
  if (syncState === 'ok') msg = 'Updated from the course sheet ' + stamp(mathCache.at, now) + '. ';
  else if (syncState === 'loading') msg = 'Checking the course sheet. ';
  else if (mathCache) msg = "Couldn't reach the course sheet. Showing the copy from " + stamp(mathCache.at, now) + '. ';
  else msg = "Couldn't reach the course sheet. Connect to the internet and reopen this page. ";
  line.appendChild(document.createTextNode(msg));
  const a = el('a', null, 'Open the sheet');
  a.href = SHEET_URL;
  a.target = '_blank';
  a.rel = 'noopener';
  a.style.color = 'var(--ink)';
  line.appendChild(a);
  sec.appendChild(line);
  const list = ((mathCache && mathCache.homework) || []).slice().reverse();
  if (!list.length) return;
  const make = items => {
    const ul = el('ul', 'rows');
    items.forEach(x => {
      const li = el('li', 'row');
      li.appendChild(el('span', 'bar'));
      const main = el('div', 'main');
      main.appendChild(el('span', 't', x.section + ' ' + x.topic));
      main.appendChild(el('span', 'm', 'Problems: ' + x.problems));
      if (x.examples && x.examples.toLowerCase() !== 'none') main.appendChild(el('span', 'm', 'Examples to review: ' + x.examples));
      li.appendChild(main);
      li.appendChild(el('span'));
      ul.appendChild(li);
    });
    return ul;
  };
  sec.appendChild(make(list.slice(0, 3)));
  if (list.length > 3) {
    const more = el('details', 'more');
    more.appendChild(el('summary', null, 'Earlier sections (' + (list.length - 3) + ')'));
    more.appendChild(make(list.slice(3)));
    sec.appendChild(more);
  }
}

    const saveB = el('button', 'primary', 'Save');
    saveB.type = 'submit';
    row.append(saveB, btn('Cancel', 'quiet', { act: 'close-sheet' }));
    f.appendChild(row);
    f.addEventListener('submit', e => {
      e.preventDefault();
      const text = what.value.trim();
      if (!text) { what.focus(); return; }
      if (course.value) {
        const [y, m, d] = (date.value || ymd(new Date())).split('-').map(Number);
        const [h, mi] = (time.value || '23:59').split(':').map(Number);
        state.items.push({ id: 'a' + Date.now(), course: course.value, title: text, type: type.value,
          due: [y, m, d, h, mi], notes: '', done: false, added: true });
      } else {
        const t = { id: 't' + Date.now(), text, date: date.value, done: false, doneOn: null };
        if (time.value) { t.time = time.value; t.dur = Number(len.value); }
        state.todos.push(t);
      }
      save();
      closeSheet();
      render();
      toast('Added ' + text + '.');
    });
    box.appendChild(f);
    sync();
    if (!pre.time) setTimeout(() => what.focus(), 60);
  });
}

function openItem(kind, id) {
  const now = new Date();
  if (kind === 'due') {
    const it = state.items.find(i => i.id === id);
    if (it) dueSheet(it, now);
  } else if (kind === 'todo') {
    const t = state.todos.find(x => 't:' + x.id === id);
    if (t) todoSheet(t, now);
  } else if (kind === 'workout' || kind === 'network') {
    const b = routineFor(fromYmd(id.slice(2))).find(x => x.id === id);
    if (b) routineSheet(b, now);
  } else if (kind === 'class') {
    const parts = id.split(':');
    const b = classesOn(fromYmd(parts[2])).find(x => x.course === parts[1]);
    if (b) classSheet(b, now);
  }
}

function dueSheet(it, now) {
  openSheet(it.title, box => {
    const d = due(it);
    box.appendChild(el('p', 'muted', it.course + ' · ' + (TYPES[it.type] || 'Assignment')));
    box.appendChild(el('p', null, 'Due ' + dayLabel(d, now) + atTime(it) + '.'));
    if (!it.done && d > now) box.appendChild(el('p', 'left', cap(timeLeft(d, now))));
    if (stillOverdue(it, now)) box.appendChild(el('p', 'left', cap(timeLeft(d, now))));
    if (it.notes) box.appendChild(el('p', 'muted', it.notes));
    const row = el('div', 'btns');
    row.append(btn(it.done ? 'Mark not done' : 'Mark done', 'primary', { act: 'due-toggle', id: it.id, close: '1' }),
      btn('Delete', 'quiet', { act: 'due-delete', id: it.id }));
    box.appendChild(row);
  });
}

function todoSheet(t, now) {
  openSheet(t.text, box => {
    const f = el('form', 'f');
    f.autocomplete = 'off';
    const what = inputEl('text', t.text);
    what.required = true;
    const date = inputEl('date', t.date || '');
    const time = inputEl('time', t.time || '');
    const len = selectEl(LENGTHS, t.dur || 60);
    const lenF = field('Length', len);
    const sync = () => { lenF.hidden = !time.value; };
    time.addEventListener('input', sync);
    time.addEventListener('change', sync);
    const moves = el('div', 'moves');
    const today = new Date();
    [['Today', ymd(today)], ['Tomorrow', ymd(addDays(today, 1))], ['Next week', ymd(addDays(mondayOf(today), 7))], ['Someday', '']].forEach(([txt, val]) => {
      const b = btn(txt, 'outline');
      b.addEventListener('click', () => { date.value = val; if (!val) { time.value = ''; sync(); } });
      moves.appendChild(b);
    });
    const pair = el('div', 'pair');
    pair.append(field('Day', date), field('Time (optional)', time));
    f.append(field('What', what), field('Move to', moves), pair, lenF);
    const row = el('div', 'btns');
    const saveB = el('button', 'primary', 'Save');
    saveB.type = 'submit';
    row.append(saveB, btn(t.done ? 'Mark not done' : 'Mark done', 'outline', { act: 'todo-toggle', id: t.id, close: '1' }),
      btn('Delete', 'quiet', { act: 'todo-delete', id: t.id }));
    f.appendChild(row);
    f.addEventListener('submit', e => {
      e.preventDefault();
      const text = what.value.trim();
      if (!text) { what.focus(); return; }
      t.text = text;
      t.date = date.value;
      if (time.value && date.value) { t.time = time.value; t.dur = Number(len.value); }
      else { delete t.time; delete t.dur; }
      save();
      closeSheet();
      render();
      toast('Saved.');
    });
    box.appendChild(f);
    sync();
  });
}

function routineSheet(b, now) {
  openSheet(b.kind === 'workout' ? b.title : 'Networking', box => {
    if (b.kind === 'workout') {
      box.appendChild(el('p', null, b.text));
    } else {
      const g = currentGoals(now);
      box.appendChild(el('p', null, b.origin === ymd(now) ? networkingToday(now) : '20 minutes on your weekly goal.'));
      box.appendChild(el('p', 'muted', 'This week: ' + GOALS.map(x => (g.counts[x.id] || 0) + ' of ' + x.target + ' ' + x.short).join(', ') + '.'));
    }
    const f = el('form', 'f');
    const date = inputEl('date', b.date);
    const time = inputEl('time', fromMin(b.start));
    const pair = el('div', 'pair');
    pair.append(field('Day', date), field('Time', time));
    f.appendChild(pair);
    f.appendChild(el('p', 'hint', 'Usually ' + clock(b.defStart) + (b.moved ? '. You moved this one.' : '.')));
    const row = el('div', 'btns');
    const saveB = el('button', 'primary', 'Save');
    saveB.type = 'submit';
    row.appendChild(saveB);
    if (b.kind === 'workout' && fromYmd(b.origin) <= now) row.appendChild(btn(b.done ? 'Mark not done' : 'Mark done', 'outline', { act: 'workout-toggle', date: b.origin, close: '1' }));
    if (b.moved) row.appendChild(btn('Back to usual time', 'quiet', { act: 'routine-reset', id: b.id }));
    if (b.kind === 'network') row.appendChild(btn('Log progress', 'quiet', { act: 'tab', tab: 'goals', close: '1' }));
    f.appendChild(row);
    f.addEventListener('submit', e => {
      e.preventDefault();
      if (!date.value || !time.value) return;
      const start = toMin(time.value);
      if (date.value === b.origin && start === b.defStart) delete state.overrides[b.id];
      else state.overrides[b.id] = { date: date.value, start };
      save();
      closeSheet();
      render();
      toast('Moved.');
    });
    box.appendChild(f);
  });
}

function classSheet(b, now) {
  openSheet(b.course + ' · ' + b.cls.name, box => {
    box.appendChild(el('p', null, dayLabel(fromYmd(b.date), now) + ', ' + rangeText(b.start, b.dur)));
    box.appendChild(el('p', 'muted', b.sub));
    const dues = state.items.filter(i => i.course === b.course && ymd(due(i)) === b.date).sort(byDue);
    if (dues.length) {
      box.appendChild(el('h3', 'sub-h', 'Due that day'));
      const ul = el('ul', 'rows');
      dues.forEach(i => ul.appendChild(dueRow(i, now)));
      box.appendChild(ul);
    }
    const row = el('div', 'btns');
    row.appendChild(btn('See all ' + b.course + ' dates', 'outline', { act: 'tab', tab: 'classes', close: '1' }));
    box.appendChild(row);
  });
}

/* ---------- Toast ---------- */

let toastTimer = 0;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
}

/* ---------- Render ---------- */

let tab = 'today';
const TAB_NAMES = { today: 'Today', calendar: 'Calendar', todo: 'To-do', classes: 'Classes', goals: 'Goals' };
const VIEWS = { today: renderToday, calendar: renderCalendar, todo: renderTodos, classes: renderClasses, goals: renderGoals };

function render() {
  if (drag && drag.active) return;
  const now = new Date();
  Object.keys(VIEWS).forEach(v => { $('view-' + v).hidden = v !== tab; });
  document.querySelectorAll('.tabs [data-tab], .tabs-top [data-tab]').forEach(b => {
    if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  $('page-title').textContent = TAB_NAMES[tab];
  const edit = $('edit-btn');
  edit.hidden = tab !== 'today';
  edit.textContent = editing ? 'Done' : 'Edit';
  VIEWS[tab](now);
  $('storage-warn').hidden = storageOk;
}

function goTab(t) {
  if (!VIEWS[t]) return;
  tab = t;
  editing = false;
  render();
  scrollTo(0, 0);
  if (t === 'calendar') requestAnimationFrame(scrollCalToNow);
}

/* ---------- Events ---------- */

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act, d = b.dataset;
  const now = new Date();
  switch (a) {
    case 'tab': closeSheet(); goTab(d.tab); return;
    case 'add': openAdd({ date: d.date, time: d.time, course: d.course }); return;
    case 'open': openItem(d.kind, d.id); return;
    case 'close-sheet': closeSheet(); return;
    case 'edit-today': editing = !editing; render(); return;
    case 'plan': planOpen = true; render(); return;
    case 'plan-close': planOpen = false; render(); return;
    case 'copy-plan': copyPlan(); return;
    case 'cal-prev': shiftCal(-1); return;
    case 'cal-next': shiftCal(1); return;
    case 'cal-today': calStart = null; render(); scrollCalToNow(); return;
    case 'due-toggle': {
      const it = state.items.find(i => i.id === d.id);
      if (it) it.done = !it.done;
      break;
    }
    case 'due-delete': {
      if (!confirm('Delete this item?')) return;
      const it = state.items.find(i => i.id === d.id);
      state.items = state.items.filter(i => i.id !== d.id);
      if (it && !it.added) state.deleted.push(keyOf(it));
      closeSheet();
      break;
    }
    case 'todo-toggle': {
      const t = state.todos.find(x => x.id === d.id);
      if (t) { t.done = !t.done; t.doneOn = t.done ? ymd(now) : null; }
      break;
    }
    case 'todo-delete': {
      if (!confirm('Delete this to-do?')) return;
      state.todos = state.todos.filter(x => x.id !== d.id);
      closeSheet();
      break;
    }
    case 'workout-toggle': {
      if (state.training.done[d.date]) delete state.training.done[d.date];
      else state.training.done[d.date] = true;
      break;
    }
    case 'routine-reset': delete state.overrides[d.id]; closeSheet(); break;
    case 'goal-inc':
    case 'goal-dec': {
      const g = currentGoals(now);
      g.counts[d.goal] = Math.max(0, (g.counts[d.goal] || 0) + (a === 'goal-inc' ? 1 : -1));
      break;
    }
    case 'card-up': moveCard(d.card, -1); break;
    case 'card-down': moveCard(d.card, 1); break;
    case 'card-hide': if (!state.layout.hidden.includes(d.card)) state.layout.hidden.push(d.card); break;
    case 'card-show': state.layout.hidden = state.layout.hidden.filter(x => x !== d.card); break;
    case 'reset': {
      if (!confirm('Reset class due dates to the starting data? Your to-dos, goals, and training stay.')) return;
      state = Object.assign(state, { seedVersion: SEED_VERSION, items: seedItems([]), deleted: [] });
      applyMath(mathCache);
      toast('Class due dates reset.');
      break;
    }
    default: return;
  }
  if (d.close) closeSheet();
  save();
  render();
});

const calEl = $('cal');
// Taps on empty calendar space add something there. Runs before the page-wide handler.
calEl.addEventListener('click', e => {
  if (suppressClick) { suppressClick = false; e.stopPropagation(); e.preventDefault(); return; }
  if (e.target.closest('[data-act]')) return;
  const col = e.target.closest('.col');
  if (col) {
    const r = col.getBoundingClientRect();
    const min = Math.floor((START_H * 60 + (e.clientY - r.top) / PX) / 30) * 30;
    openAdd({ date: col.dataset.date, time: fromMin(Math.min(min, 23 * 60 + 30)) });
    return;
  }
  const c = e.target.closest('.adcell');
  if (c) openAdd({ date: c.dataset.date });
}, true);

calEl.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  const b = e.target.closest('.blk[data-drag]');
  if (b) beginDrag(b, e.clientX, e.clientY, 'mouse');
});
document.addEventListener('mousemove', e => {
  if (!drag || drag.type !== 'mouse') return;
  if (!drag.active) {
    if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 5) return;
    startDrag();
  }
  e.preventDefault();
  moveDrag(e.clientX, e.clientY);
});
document.addEventListener('mouseup', () => {
  if (!drag || drag.type !== 'mouse') return;
  if (drag.active) endDrag(); else cancelDrag();
});

calEl.addEventListener('touchstart', e => {
  if (e.touches.length > 1) { cancelDrag(); swipe = null; return; }
  const t = e.touches[0];
  swipe = { x: t.clientX, y: t.clientY, at: Date.now() };
  const b = e.target.closest('.blk[data-drag]');
  if (b) {
    beginDrag(b, t.clientX, t.clientY, 'touch');
    drag.timer = setTimeout(startDrag, 380);
  }
}, { passive: true });
document.addEventListener('touchmove', e => {
  if (!drag || drag.type !== 'touch') return;
  const t = e.touches[0];
  if (!drag.active) {
    if (Math.hypot(t.clientX - drag.x0, t.clientY - drag.y0) > 8) cancelDrag(); // the finger is scrolling
    return;
  }
  e.preventDefault();
  moveDrag(t.clientX, t.clientY);
}, { passive: false });
document.addEventListener('touchend', e => {
  if (drag && drag.type === 'touch') {
    if (drag.active) { endDrag(); swipe = null; return; }
    cancelDrag();
  }
  if (swipe && tab === 'calendar') {
    const t = e.changedTouches[0];
    const dx = t.clientX - swipe.x, dy = t.clientY - swipe.y;
    if (Math.abs(dx) > 60 && Math.abs(dx) > 2 * Math.abs(dy) && Date.now() - swipe.at < 700) shiftCal(dx < 0 ? 1 : -1);
  }
  swipe = null;
});
document.addEventListener('touchcancel', () => { if (drag && drag.type === 'touch') cancelDrag(); swipe = null; });

const todoForm = $('todo-form');
todoForm.elements.when.addEventListener('change', e => { $('todo-date-wrap').hidden = e.target.value !== 'date'; });
todoForm.addEventListener('submit', e => {
  e.preventDefault();
  const text = todoForm.elements.text.value.trim();
  if (!text) return;
  const now = new Date();
  const when = todoForm.elements.when.value;
  let date = '';
  if (when === 'today') date = ymd(now);
  else if (when === 'tomorrow') date = ymd(addDays(now, 1));
  else if (when === 'date') date = todoForm.elements.date.value || ymd(now);
  state.todos.push({ id: 't' + Date.now(), text, date, done: false, doneOn: null });
  save();
  render();
  todoForm.reset();
  $('todo-date-wrap').hidden = true;
  todoForm.elements.text.focus();
  toast('Added.');
});

let lastDays = calDays();
addEventListener('resize', () => {
  const n = calDays();
  if (n !== lastDays) { lastDays = n; render(); }
});

// Keep the clock and the now-line current, without wiping something you're typing.
function tick() {
  const a = document.activeElement;
  if (sheet.open || (a && a.closest('main') && a.matches('input, select, textarea'))) return;
  render();
}
setInterval(tick, 60000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  tick();
  if (!mathCache || Date.now() - mathCache.at > 30 * 60000) syncMath();
});

applyMath(mathCache);
render();
syncMath();
</script>
</body>
</html>
